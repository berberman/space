  </defs>
  <rect width="800" height="1000" fill="url(#paper)"/>
  <rect x="34" y="34" width="732" height="932" rx="18" fill="none" stroke="#d8d6cf" stroke-width="4"/>
  <circle cx="400" cy="350" r="122" fill="none" stroke="url(#ink)" stroke-width="22" opacity="0.72"/>
