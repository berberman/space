  <text x="400" y="872" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="32" font-weight="700" fill="#858177" letter-spacing="3">PROFILE PHOTO</text>
  <text x="400" y="916" text-anchor="middle" font-family="Avenir Next, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#858177" letter-spacing="2">PLACEHOLDER</text>
